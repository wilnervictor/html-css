<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="pacote.js" method="get" autocomplete="on">
      <p>
        <label for="inome">Nome:</label>
        <input type="text" name="inom" id="inome" placeholder="Digite seu nome..." required maxlength="30" minlength="15" autocomplete="name" size="40">
      </p>
      <p>
        <label for="iperiodo">Periodo letivo</label>
        <input type="month" name="iperio" id="iperiodo" value="2025-07">
      </p>
      <p>
        <label for="idata">Dia da prova</label>
        <input type="date" name="dia" id="idata">
      </p>
      <p>
        <label for="ihora">Hora</label>
        <input type="time" name="ihor" id="ihora">
      </p>
      <p>
        <label for="inota">Nota;</label>
        <input type="number" name="inot" id="inota" required placeholder="0 a 10" min="0" max="10" step="0.5">
      </p>
      <p>
       <input type="submit" value="Enviar">
       <input type="reset" value="Limpar">
      </p>
    </form>
</body>
</html>
