<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexible Box</title>
    <style>
        .container{
         background-color: lightsalmon;
         display: flex;
         flex-flow: row nowrap;
         height: 400px;
         align-items: flex-start;
        }
        .item{
        background-color: aqua;
        border: 1px solid black;
        text-align: center;
        padding: 20px;
        }
        #i1{
          align-self: center;
        }
        #i2{
          align-self: auto;
        }
        #i3{
          align-self: baseline;
        }
        #i4{
          align-self: self-end;
        }
        #i5{
          align-self: self-start;
        }
        #i6{
          align-self: first baseline;
        }
        #i7{
          align-self: self-end;
        }
    </style>
  </head>
  <body>
    <section class="container">
      <div class="item" id="i1">a</div>
      <div class="item" id="i2">b</div>
      <div class="item" id="i3">c</div>
      <div class="item" id="i4">d</div>
      <div class="item" id="i5">e</div>
      <div class="item" id="i6">f</div>
      <div class="item" id="i7">g</div>
    </section>
  </body>
</html>
