<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        caption{
           text-align: center;
           background-color: rgba(128, 128, 128, 0.425);
           font-size: 1.2em;
           padding: 2px;
        }
        table{
         border-collapse: collapse;
         width: 600px;
        }
        th,td{
         border: 1px solid black;
         padding: 10px;
        }
        td{
            padding-left: 5px;
        }
        .destaque{
            background-color: aqua;
        }
        .cnome{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>Exercício de tabela</h1>
    <table>
        <colgroup>
           <col class="cnome">
           <col class="csexo">
           <col class="cidade">
           <col class="cprof">
        </colgroup>
        <caption>
            Cadastro
        </caption>
        <thead>
          <tr>
              <th scope="col">Nome</th>
              <th scope="col">Sexo</th>
              <th scope="col">Idade</th>
              <th scope="col">Profisão</th>
          </tr>
          <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>49</td>
            <td>Jornalista</td>
          </tr>
          <tr>
            <td>José Luis</td>
            <td>M</td>
            <td>32</td>
            <td>Professor</td>
          </tr>
          <tr>
            <td>Ana</td>
            <td>F</td>
            <td>22</td>
            <td>Medica</td>
          </tr>
          <tr>
            <td>Hercules</td>
            <td>M</td>
            <td>30</td>
            <td>Entregador</td>
          </tr>
          <tr>
            <td>Maria</td>
            <td>F</td>
            <td>47</td>
            <td>Infermeira</td>
          </tr>
        </thead>
        <tbody>

        </tbody>
        <tfoot>

        </tfoot>
    </table>
</body>
</html>
