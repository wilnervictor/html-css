<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <a href="#" onclick="apertou()">Clique em min</a>
    <div id="saida">

    </div>
    <script>
        function apertou(){
            let sai = window.document.getElementById('saida')
            sai.innerHTML += '<p>Você clicou!</p>'
        }
    </script>
</body>
</html>
